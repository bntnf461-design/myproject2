plugins {
    id 'com.android.application'
}

// アプリの画面は ../highlight/HighlightMaker.html をそのまま使う（Web 版と同じ1つのファイル）
def webAssets = layout.buildDirectory.dir("generated/webassets")
def copyWeb = tasks.register('copyWebApp', Copy) {
    from('../../highlight') {
        include 'HighlightMaker.html', 'manifest.webmanifest', 'icon-*.png'
        rename 'HighlightMaker.html', 'index.html'
    }
    into webAssets
}

android {
    namespace 'com.bntnf461.highlightmaker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bntnf461.highlightmaker'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    signingConfigs {
        // 開発用の鍵（パスワードが公開されているので、配布用には使わないこと）
        devkey {
            storeFile file('highlight-dev.keystore')
            storePassword 'android'
            keyAlias 'highlight'
            keyPassword 'android'
        }
        // 配布用の鍵：GitHub の Secrets（または環境変数）から読む。鍵とパスワードはリポジトリに置かない
        //   RELEASE_KEYSTORE（鍵ファイルの場所）／RELEASE_STORE_PASSWORD／RELEASE_KEY_ALIAS／RELEASE_KEY_PASSWORD
        def ks = System.getenv('RELEASE_KEYSTORE')
        if (ks && file(ks).exists()) {
            release {
                storeFile file(ks)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.devkey }
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            } else {
                // 配布用の鍵がない時だけ開発用の鍵で署名する（その APK は配布しないこと）
                logger.warn('警告: 配布用の鍵（RELEASE_KEYSTORE）がないので、開発用の鍵で署名します。この APK は配布しないでください。')
                signingConfig signingConfigs.devkey
            }
            minifyEnabled false
        }
    }
    sourceSets {
        main { assets.srcDirs += webAssets }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 端末の中で動画を H.264 に変換する（H.265/HEVC・HDR・4K の動画を読めるようにする）。通信はしない
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
    implementation "androidx.media3:media3-common:$media3"
}

tasks.named('preBuild') { dependsOn copyWeb }
