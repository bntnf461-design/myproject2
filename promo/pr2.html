<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>作業要領書 PR動画（実写風）</title>
<style>
  :root { --navy: #13284f; --gold: #f2b705; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "IPAPGothic", sans-serif; color: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .bg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .photo { position: absolute; left: 0; top: 0; width: 686px; height: 768px; transform-origin: 0 0; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .photo img.fg { width: 686px; height: 768px; display: block; }
  .tabui { position: absolute; left: 0; top: 0; width: 680px; height: 540px; transform-origin: 0 0; overflow: hidden; }
  .tabui img { width: 680px; height: 540px; display: block; filter: brightness(.93) contrast(1.05); }
  .tabui .glare { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%); }
  .tabui .prog { position: absolute; left: 30px; bottom: 26px; height: 10px; background: var(--gold); border-radius: 5px; }
  .h1 { position: absolute; font-size: 84px; font-weight: bold; line-height: 1.35; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  .h2 { position: absolute; font-size: 58px; font-weight: bold; line-height: 1.4; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .chip { position: absolute; padding: 12px 30px; border-radius: 50px; background: rgba(255,255,255,.95); color: var(--navy); font-size: 40px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .gold { color: var(--gold); }
  .monitor { position: absolute; left: 240px; top: 150px; width: 1440px; height: 830px; transform-origin: 50% 40%; }
  #monWrap { position: absolute; inset: 0; transform: scale(.84); transform-origin: 50% 12%; }
  .monitor .frame { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; background: #0d0f13; border-radius: 22px; box-shadow: 0 50px 100px rgba(0,0,0,.7), inset 0 0 0 2px #2a2f38; }
  .monitor .screen { position: absolute; left: 20px; top: 20px; width: 1400px; height: 787.5px; overflow: hidden; border-radius: 6px; background: #fff; }
  .monitor .screen img { position: absolute; left: 0; top: 0; width: 1400px; height: 787.5px; }
  .monitor .stand { position: absolute; left: 640px; top: 810px; width: 160px; height: 70px; background: linear-gradient(#20242c, #0d0f13); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .monitor .shine { position: absolute; inset: 20px; border-radius: 6px; background: linear-gradient(115deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%); pointer-events: none; }
  .ripple { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 6px solid var(--gold); transform: translate(-50%, -50%); opacity: 0; }
  .label { position: absolute; left: 0; right: 0; text-align: center; top: 40px; font-size: 44px; font-weight: bold; color: #fff; text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  .label b { color: var(--gold); }
  .card { position: absolute; width: 380px; height: 300px; border-radius: 26px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; text-align: center; backdrop-filter: blur(6px); }
  .card .ic { font-size: 96px; line-height: 1; }
  .card .tx { font-size: 40px; font-weight: bold; margin-top: 14px; line-height: 1.35; }
  #sub { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1700px; padding: 14px 34px; border-radius: 10px;
    background: rgba(0,0,0,.55); font-size: 40px; font-weight: bold; line-height: 1.45; text-align: center; white-space: normal; width: max-content; z-index: 50; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  #flash { background: #fff; opacity: 0; z-index: 40; }
  #vig { z-index: 30; } #grain { z-index: 31; opacity: .06; mix-blend-mode: overlay; }
  #endc { background: radial-gradient(ellipse at 50% 40%, #22417a, #0b1a36 70%); }
</style>
</head>
<body>
<div id="stage">

  <!-- 1. 問いかけ -->
  <div class="scene" id="s_title">
    <img class="bg" src="bg_L.jpg">
    <div class="photo" id="p_title"><img class="fg" src="fg_L.png"></div>
    <div class="h1" id="t_title" style="left:110px;top:330px">その作業手順、<br>紙だけで<br><span class="gold">伝わっていますか？</span></div>
  </div>

  <!-- 2. これまで -->
  <div class="scene" id="s_before">
    <img class="bg" src="bg_L.jpg">
    <div class="photo" id="p_before"><img class="fg" src="fg_L.png"></div>
    <div class="chip" id="c_b1" style="left:90px;top:200px">新人</div>
    <div class="chip" id="c_b2" style="left:90px;top:310px">外国人スタッフ</div>
    <div class="chip" id="c_b3" style="left:90px;top:420px">久しぶりの作業</div>
  </div>

  <!-- 3・4. これから（タブレット） -->
  <div class="scene" id="s_after">
    <img class="bg" src="bg_R.jpg">
    <div class="photo" id="p_after"><img class="fg" src="fg_R.png">
      <div class="tabui" id="tab"><img src="tab_ui.jpg"><div class="prog" id="tprog"></div><div class="glare"></div></div>
    </div>
    <div class="h1" id="t_after" style="left:0;right:0;top:760px;text-align:center">要領書を、<span class="gold">タップで動画</span>に。</div>
  </div>

  <!-- 5〜9. 実際の画面 -->
  <div class="scene" id="s_ui">
    <img class="bg" src="bg_ui.jpg">
    <div id="monWrap"><div class="monitor" id="mon">
      <div class="frame"></div>
      <div class="screen" id="scr"></div>
      <div class="shine"></div>
      <div class="stand"></div>
      <div class="ripple" id="rip"></div>
    </div></div>
    <div class="label" id="lab"></div>
  </div>

  <!-- 10. 使える場所を選ばない -->
  <div class="scene" id="s_feat">
    <img class="bg" src="bg_ui.jpg">
    <div class="h2" style="left:0;right:0;top:150px;text-align:center">どんな現場でも、すぐ使える</div>
  </div>

  <!-- 11. 結果 -->
  <div class="scene" id="s_result">
    <img class="bg" src="bg_R.jpg">
    <div class="photo" id="p_result"><img class="fg" src="fg_R.png">
      <div class="tabui" id="tab2"><img src="tab_ui.jpg"><div class="glare"></div></div>
    </div>
    <div class="h2" id="r1" style="left:90px;top:330px">新人も、<br>ひとりで、正しく。</div>
    <div class="h2 gold" id="r2" style="left:90px;top:560px">ベテランは、<br>本来の仕事へ。</div>
  </div>

  <!-- 12. 終わり -->
  <div class="scene" id="s_end">
    <div class="overlay" id="endc"></div>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
      <div>
        <div style="display:inline-grid;place-items:center;width:160px;height:160px;border-radius:30px;background:#fff;color:#13284f;font-size:108px;font-weight:bold">要</div>
        <div style="font-size:96px;font-weight:bold;margin-top:30px">作業要領書 × 動画</div>
        <div style="font-size:50px;margin-top:14px">動画で伝わる作業要領書を、今の要領書から。</div>
        <div style="font-size:38px;margin-top:40px;color:#f2b705;font-weight:bold">完全オフライン ｜ サーバー不要 ｜ Excel 取り込み ｜ 多言語</div>
        <div style="font-size:32px;margin-top:46px;color:#c8d3e8">お問い合わせ：〇〇〇〇（ここに連絡先）</div>
      </div>
    </div>
    <div id="credit" style="position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:24px;color:rgba(255,255,255,.7)"></div>
  </div>

  <div class="overlay" id="flash"></div>
  <img class="overlay" id="vig" src="vignette.png">
  <img class="overlay" id="grain" src="grain0.png">
  <div id="sub"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function ease(x) { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerp(a, b, p) { return a + (b - a) * p; }

// ナレーション（秒）は外から渡す。場面の長さ＝ナレーション＋余白
var DUR = window.DUR || { n1: 5.2, n2: 8.6, n3: 3.6, n4: 7.3, n5: 7.6, n6: 4.4, n7: 6.9, n8: 4.5, n9: 3.9, n10: 6.3, n11: 4.9, n12: 7.0 };
var TEXT = {
  n1: "その作業手順、紙の要領書だけで、ちゃんと伝わっていますか？",
  n2: "文字ばかりの要領書だと、新人さんや、外国人のスタッフには、なかなか伝わりません。\n結局、ベテランが、つきっきりで教えることに。",
  n3: "そこで。\n作業要領書を、タップで動画にしませんか。",
  n4: "手順をタップすると、その部分の動画が流れます。\nあとは、見たとおりに作業するだけ。",
  n5: "作業する人は、大きなボタンを押していくだけ。\nライン、工程、作業の順に選べば、すぐに開けます。",
  n6: "コツや注意点も、動画と一緒に確認できます。",
  n7: "インドネシア語にも、ワンタッチで切り替えられます。\n翻訳は、日本語で意味を確かめてから使えるので、安心です。",
  n8: "いまお使いの、Excelの要領書も、そのまま取り込めます。",
  n9: "動画は、1 本撮って、手順の切れ目で区切るだけ。",
  n10: "インターネットも、サーバーも要りません。\n古いパソコンでも、軽く動きます。",
  n11: "新人さんも、ひとりで、正しく。\nベテランは、本来の仕事へ。",
  n12: "動画で伝わる、作業要領書。\nまずは、いまの要領書から、始めてみませんか。"
};
var LEAD = 0.5, TAIL = 0.7;
var ORDER = ["n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12"];
var SEG = {}, T = 0;
ORDER.forEach(function (k) { var len = LEAD + DUR[k] + TAIL + (k === "n12" ? 1.5 : 0); SEG[k] = { a: T, b: T + len, len: len, voice: T + LEAD }; T += len; });
window.TOTAL = T;
window.VOICE_AT = ORDER.map(function (k) { return [k, SEG[k].voice]; });

// 場面ごとの出る時間
function span(keys) { return { a: SEG[keys[0]].a, b: SEG[keys[keys.length - 1]].b }; }
var SC = {
  s_title: span(["n1"]), s_before: span(["n2"]), s_after: span(["n3", "n4"]),
  s_ui: span(["n5", "n6", "n7", "n8", "n9"]), s_feat: span(["n10"]), s_result: span(["n11"]), s_end: span(["n12"])
};
var FADE = 0.6;
function vis(a, b, t) { return Math.min(ease((t - a + FADE / 2) / FADE), 1 - ease((t - b + FADE / 2) / FADE)); }

// 写真を、画像の (fx, fy) が画面の (cx, cy) に来るように、倍率 z で置く
var BASE = 1080 / 768;
function place(el, z, fx, fy, cx, cy) {
  var s = BASE * z;
  el.style.transform = "translate(" + (cx - fx * s) + "px," + (cy - fy * s) + "px) scale(" + s + ")";
}

// 四角を 4 つの点に合わせる（透視変換）
function homography(w, h, q) {
  var src = [[0, 0], [w, 0], [w, h], [0, h]], A = [], B = [];
  for (var i = 0; i < 4; i++) {
    var x = src[i][0], y = src[i][1], X = q[i][0], Y = q[i][1];
    A.push([x, y, 1, 0, 0, 0, -X * x, -X * y]); B.push(X);
    A.push([0, 0, 0, x, y, 1, -Y * x, -Y * y]); B.push(Y);
  }
  for (var c = 0; c < 8; c++) {
    var p = c; for (var r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    var tA = A[c]; A[c] = A[p]; A[p] = tA; var tB = B[c]; B[c] = B[p]; B[p] = tB;
    for (var r2 = c + 1; r2 < 8; r2++) { var f = A[r2][c] / A[c][c]; for (var k = c; k < 8; k++) A[r2][k] -= f * A[c][k]; B[r2] -= f * B[c]; }
  }
  var h8 = new Array(8);
  for (var i2 = 7; i2 >= 0; i2--) { var s = B[i2]; for (var j = i2 + 1; j < 8; j++) s -= A[i2][j] * h8[j]; h8[i2] = s / A[i2][i2]; }
  var a = h8;
  return "matrix3d(" + [a[0], a[3], 0, a[6], a[1], a[4], 0, a[7], 0, 0, 1, 0, a[2], a[5], 0, 1].join(",") + ")";
}
var QUAD = [[191.7, 161.7], [348.3, 166.7], [346.7, 288.3], [190, 290]];
// 最後の画面の音声クレジット（声に合わせて外から渡す。春日部つむぎなら「VOICEVOX:春日部つむぎ」）
$("credit").textContent = window.CREDIT || 'ナレーション音声：HTS Voice "Mei" © Nagoya Institute of Technology（CC BY 3.0）';
$("tab").style.transform = homography(680, 540, QUAD);
$("tab2").style.transform = homography(680, 540, QUAD);

// 実際の画面（モニター）の切り替え
var UI = [
  { k: "n5", imgs: ["ui/u_easy1.jpg", "ui/u_easy2.jpg", "ui/u_easy3.jpg"], lab: "作業者用の<b>かんたん画面</b>", taps: [[0.30, 0.205, 0.215], [0.63, 0.185, 0.215], [0.9, 0.5, 0.3]] },
  { k: "n6", imgs: ["ui/u_player.jpg"], lab: "<b>コツ・注意点（急所）</b>も、動画と一緒に", zoom: [0.78, 0.45] },
  { k: "n7", imgs: ["ui/u_trans.jpg", "ui/u_player_id.jpg"], lab: "<b>インドネシア語</b>に切り替え・日本語で確認" },
  { k: "n8", imgs: ["ui/u_excel.jpg"], lab: "今の <b>Excel の要領書</b>をそのまま取り込み" },
  { k: "n9", imgs: ["ui/u_cutter.jpg"], lab: "1 本撮って、<b>区切るだけ</b>で動画付き", zoom: [0.5, 0.62] }
];
(function () {
  var scr = $("scr");
  UI.forEach(function (u, i) { u.imgs.forEach(function (src, j) { var im = document.createElement("img"); im.src = src; im.id = "ui" + i + "_" + j; im.style.opacity = 0; scr.appendChild(im); }); });
  var FE = [["📴", "完全<br>オフライン"], ["🗄", "サーバー<br>不要"], ["💻", "性能の低い<br>PC でも軽快"], ["📱", "PC でも<br>タブレットでも"]];
  var f = $("s_feat");
  FE.forEach(function (x, i) {
    var d = document.createElement("div"); d.className = "card"; d.id = "fe" + i;
    d.style.left = (130 + i * 420) + "px"; d.style.top = "400px";
    d.innerHTML = '<div><div class="ic">' + x[0] + '</div><div class="tx">' + x[1] + '</div></div>';
    f.appendChild(d);
  });
})();

function render(t) {
  // 場面の重なり
  Object.keys(SC).forEach(function (id) { $(id).style.opacity = vis(SC[id].a, SC[id].b, t); });

  // 1. 問いかけ：作業者に寄っていく
  var p1 = clamp((t - SC.s_title.a) / (SC.s_title.b - SC.s_title.a));
  place($("p_title"), lerp(1.0, 1.1, p1), 343, 400, 1350, 560);
  $("t_title").style.opacity = ease((t - 0.6) / 1); $("t_title").style.transform = "translateY(" + (24 - 24 * ease((t - .6) / 1)) + "px)";

  // 2. これまで：作業者 → ベテランへ流れる
  var p2 = clamp((t - SC.s_before.a) / (SC.s_before.b - SC.s_before.a));
  place($("p_before"), lerp(1.15, 1.3, p2), lerp(300, 520, ease(p2)), lerp(330, 300, p2), 1220, 540);
  ["c_b1", "c_b2", "c_b3"].forEach(function (id, i) {
    var s = SC.s_before.a + 2.2 + i * 1.1;
    $(id).style.opacity = ease((t - s) / .5); $(id).style.transform = "translateX(" + (-40 + 40 * ease((t - s) / .5)) + "px)";
  });

  // 3・4. タブレット：画面に寄った状態から、作業者が見える全体へ
  var a3 = SC.s_after.a, mid = SEG.n4.a, b4 = SC.s_after.b;
  $("flash").style.opacity = t > a3 - .3 && t < a3 + .6 ? (1 - Math.abs(t - a3 - .1) / .5) * .85 : 0;
  var zoomIn = clamp((t - a3) / (mid - a3)), out = ease((t - mid) / (b4 - mid) * 1.3);
  var z = lerp(lerp(3.2, 3.5, zoomIn), 1.02, out);
  var fx = lerp(270, 400, out), fy = lerp(226, 400, out), cx = lerp(960, 1000, out), cy = lerp(420, 540, out);
  place($("p_after"), z, fx, fy, cx, cy);
  $("t_after").style.opacity = Math.min(ease((t - a3 - .6) / .6), 1 - ease((t - mid + .2) / .5));
  $("tprog").style.width = (620 * clamp((t - a3 - .8) / (b4 - a3 - 1))) + "px";

  // 5〜9. 実際の画面
  var mon = $("mon"), rip = $("rip"), lab = $("lab"), labTxt = "", labO = 0;
  UI.forEach(function (u, i) {
    var sa = SEG[u.k].a, sb = SEG[u.k].b, sl = sb - sa, n = u.imgs.length;
    u.imgs.forEach(function (src, j) {
      var ja = sa + sl * j / n, jb = sa + sl * (j + 1) / n;
      if (i === 0 && j === 0) ja = sa - 2; // 最初は場面の入りから見せる
      $("ui" + i + "_" + j).style.opacity = vis(ja, jb, t);
    });
    if (t >= sa - .3 && t < sb) { labTxt = u.lab; labO = Math.min(ease((t - sa) / .5), 1 - ease((t - sb + .5) / .5)); }
    if (t >= sa && t < sb) {
      var lp = (t - sa) / sl;
      var zz = u.zoom ? lerp(1, 1.18, ease(lp)) : lerp(1, 1.04, lp);
      mon.style.transformOrigin = u.zoom ? (u.zoom[0] * 100) + "% " + (u.zoom[1] * 100) + "%" : "50% 40%";
      mon.style.transform = "scale(" + zz + ")";
      rip.style.opacity = 0;
      (u.taps || []).forEach(function (tp) {
        var at = sa + sl * tp[0] - .5, rp = clamp((t - at) / .6);
        if (rp > 0 && rp < 1) { rip.style.left = (20 + 1400 * tp[1]) + "px"; rip.style.top = (20 + 787.5 * tp[2]) + "px"; rip.style.opacity = 1 - rp; rip.style.width = rip.style.height = (20 + 90 * rp) + "px"; }
      });
    }
  });
  lab.innerHTML = labTxt; lab.style.opacity = labO;

  // 10. 使える場所を選ばない
  for (var i = 0; i < 4; i++) {
    var s = SEG.n10.a + .5 + i * .7, e = $("fe" + i);
    e.style.opacity = ease((t - s) / .5); e.style.transform = "translateY(" + (40 - 40 * ease((t - s) / .5)) + "px)";
  }

  // 11. 結果：作業者にゆっくり寄る
  var p11 = clamp((t - SC.s_result.a) / (SC.s_result.b - SC.s_result.a));
  place($("p_result"), lerp(1.12, 1.25, p11), 470, 420, 1330, 560);
  $("r1").style.opacity = ease((t - SEG.n11.a - .3) / .6);
  $("r2").style.opacity = ease((t - SEG.n11.a - 2.2) / .6);

  // 字幕（ナレーションに合わせる）
  var sub = $("sub"), st = "", so = 0;
  ORDER.forEach(function (k) {
    if (k === "n12") return; // 終わりの画面は字幕なし（画面の文字と同じため）
    var a = SEG[k].voice - .15, b = SEG[k].voice + DUR[k] + .35;
    var o = Math.min(ease((t - a) / .25), 1 - ease((t - b) / .25));
    if (o > so) { so = o; st = TEXT[k]; }
  });
  sub.innerHTML = st.replace(/\n/g, "<br>"); sub.style.opacity = so; sub.style.display = so > 0.01 ? "block" : "none";

  // フィルムの粒子
  $("grain").src = "grain" + (Math.floor(t * 24) % 6) + ".png";
}
render(0);
</script>
</body>
</html>
