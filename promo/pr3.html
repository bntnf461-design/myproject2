<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>作業要領書 PR動画（動きのある版）</title>
<style>
  :root { --navy: #13284f; --gold: #f2b705; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "IPAPGothic", sans-serif; color: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .cam { position: absolute; inset: -40px; }            /* 手持ちカメラの揺れ用（少し大きめ） */
  .lay { position: absolute; left: 0; top: 0; width: 686px; height: 768px; transform-origin: 0 0; will-change: transform; }
  .lay img { width: 686px; height: 768px; display: block; }
  .tabui { position: absolute; left: 0; top: 0; width: 680px; height: 540px; transform-origin: 0 0; overflow: hidden; background: #0b1a36; }
  .tabui img { width: 680px; height: 540px; object-fit: cover; object-position: 0 0; display: block; filter: brightness(.9) contrast(1.04); }
  .tabui .glare { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%); }
  .h1 { position: absolute; font-size: 84px; font-weight: bold; line-height: 1.35; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
  .h2 { position: absolute; font-size: 58px; font-weight: bold; line-height: 1.4; text-shadow: 0 4px 20px rgba(0,0,0,.7); }
  .chip { position: absolute; padding: 12px 30px; border-radius: 50px; background: rgba(255,255,255,.95); color: var(--navy); font-size: 40px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .gold { color: var(--gold); }
  .bgimg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #monWrap { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .monitor { position: absolute; left: 280px; top: 150px; width: 1360px; height: 800px; }
  .monitor .frame { position: absolute; left: 0; top: 0; width: 1360px; height: 785px; background: #0d0f13; border-radius: 20px; box-shadow: 0 50px 100px rgba(0,0,0,.7), inset 0 0 0 2px #2a2f38; }
  .monitor .screen { position: absolute; left: 18px; top: 18px; width: 1324px; height: 745px; overflow: hidden; border-radius: 6px; background: #fff; }
  .monitor .screen img { position: absolute; left: 0; top: 0; width: 1324px; height: 745px; opacity: 0; transform-origin: 0 0; }
  .monitor .stand { position: absolute; left: 600px; top: 785px; width: 160px; height: 70px; background: linear-gradient(#20242c, #0d0f13); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .monitor .shine { position: absolute; inset: 18px 18px auto 18px; height: 745px; border-radius: 6px; background: linear-gradient(115deg, rgba(255,255,255,.08), rgba(255,255,255,0) 40%); }
  .label { position: absolute; left: 0; right: 0; text-align: center; top: 46px; font-size: 46px; font-weight: bold; text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  .label b { color: var(--gold); }
  .card { position: absolute; width: 380px; height: 300px; border-radius: 26px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; text-align: center; }
  .card .ic { font-size: 96px; line-height: 1; }
  .card .tx { font-size: 40px; font-weight: bold; margin-top: 14px; line-height: 1.35; }
  #sub { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1700px; width: max-content; padding: 14px 34px; border-radius: 10px;
    background: rgba(0,0,0,.55); font-size: 40px; font-weight: bold; line-height: 1.45; text-align: center; z-index: 50; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  #flash { background: #fff; opacity: 0; z-index: 40; }
  #vig { z-index: 30; } #grain { z-index: 31; opacity: .07; mix-blend-mode: overlay; }
  #endc { background: radial-gradient(ellipse at 50% 40%, #22417a, #0b1a36 70%); }
</style>
</head>
<body>
<div id="stage">

  <!-- 1・2. これまで（左の写真：人物と背景を別々に動かす） -->
  <div class="scene" id="s_before">
    <img class="bgimg" src="bg_L.jpg">
    <div class="cam" id="cam1">
      <div class="lay" id="b_bg"><img src="L_bg_g.jpg"></div>
      <div class="lay" id="b_fg"><img src="L_fg_g.png"></div>
    </div>
    <div class="h1" id="t_title" style="left:110px;top:300px">その作業手順、<br>紙だけで<br><span class="gold">伝わっていますか？</span></div>
    <div class="chip" id="c_b1" style="left:90px;top:200px">新人</div>
    <div class="chip" id="c_b2" style="left:90px;top:310px">外国人スタッフ</div>
    <div class="chip" id="c_b3" style="left:90px;top:420px">久しぶりの作業</div>
  </div>

  <!-- 3・4・11. これから（右の写真） -->
  <div class="scene" id="s_after">
    <img class="bgimg" src="bg_R.jpg">
    <div class="cam" id="cam2">
      <div class="lay" id="a_bg"><img src="R_bg_g.jpg">
        <div class="tabui" id="tab"><img id="vtab" data-clip="r_easy" alt=""><div class="glare"></div></div>
      </div>
      <div class="lay" id="a_fg"><img src="R_fg_g.png"></div>
    </div>
    <div class="h1" id="t_after" style="left:0;right:0;top:760px;text-align:center">要領書を、<span class="gold">タップで動画</span>に。</div>
    <div class="h2" id="r1" style="left:90px;top:330px">新人さんも、<br>ひとりで、正しく。</div>
    <div class="h2 gold" id="r2" style="left:90px;top:560px">ベテランは、<br>本来の仕事へ。</div>
  </div>

  <!-- 5〜9. 実際の操作（録画） -->
  <div class="scene" id="s_ui">
    <img class="bgimg" src="bg_ui.jpg">
    <div id="monWrap"><div class="monitor">
      <div class="frame"></div>
      <div class="screen" id="scr"></div>
      <div class="shine"></div>
      <div class="stand"></div>
    </div></div>
    <div class="label" id="lab"></div>
  </div>

  <!-- 10. どこでも使える -->
  <div class="scene" id="s_feat">
    <img class="bgimg" src="bg_ui.jpg">
    <div class="h2" style="left:0;right:0;top:150px;text-align:center">どんな現場でも、すぐ使える</div>
  </div>

  <!-- 12. 終わり -->
  <div class="scene" id="s_end">
    <div class="overlay" id="endc"></div>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
      <div>
        <div style="display:inline-grid;place-items:center;width:160px;height:160px;border-radius:30px;background:#fff;color:#13284f;font-size:108px;font-weight:bold">要</div>
        <div style="font-size:96px;font-weight:bold;margin-top:30px">作業要領書 × 動画</div>
        <div style="font-size:50px;margin-top:14px">動画で伝わる作業要領書を、今の要領書から。</div>
        <div style="font-size:38px;margin-top:40px;color:#f2b705;font-weight:bold">完全オフライン ｜ サーバー不要 ｜ Excel 取り込み ｜ 多言語</div>
        <div style="font-size:32px;margin-top:46px;color:#c8d3e8">お問い合わせ：〇〇〇〇（ここに連絡先）</div>
      </div>
    </div>
    <div id="credit" style="position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:24px;color:rgba(255,255,255,.7)"></div>
  </div>

  <div class="overlay" id="flash"></div>
  <img class="overlay" id="vig" src="vignette.png">
  <img class="overlay" id="grain" src="grain0.png">
  <div id="sub"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function ease(x) { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerp(a, b, p) { return a + (b - a) * p; }

var DUR = window.DUR || { n1: 5.1, n2: 11.4, n3: 4.5, n4: 6.8, n5: 8.4, n6: 3.9, n7: 8.9, n8: 4.7, n9: 4.1, n10: 6.0, n11: 5.6, n12: 7.0 };
var TEXT = window.TEXT || {};
$("credit").textContent = window.CREDIT || 'ナレーション音声：HTS Voice "Mei" © Nagoya Institute of Technology（CC BY 3.0）';
var LEAD = 0.5, TAIL = 0.7;
var ORDER = ["n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12"];
var SEG = {}, T = 0;
ORDER.forEach(function (k) { var len = LEAD + DUR[k] + TAIL + (k === "n12" ? 1.5 : 0); SEG[k] = { a: T, b: T + len, len: len, voice: T + LEAD }; T += len; });
window.TOTAL = T;
window.VOICE_AT = ORDER.map(function (k) { return [k, SEG[k].voice]; });
function span(a, b) { return { a: SEG[a].a, b: SEG[b || a].b }; }
var SC = { s_before: span("n1", "n2"), s_after: span("n3", "n4"), s_ui: span("n5", "n9"), s_feat: span("n10"), s_end: span("n12") };
var RESULT = span("n11");
var FADE = 0.6;
function vis(a, b, t) { return Math.min(ease((t - a + FADE / 2) / FADE), 1 - ease((t - b + FADE / 2) / FADE)); }

// 写真の層を置く：画像の (fx,fy) が画面の (cx,cy) に来るよう倍率 z。cam の余白 40px 分を足す
var BASE = 1080 / 768;
function place(el, z, fx, fy, cx, cy) {
  var s = BASE * z;
  el.style.transform = "translate(" + (cx + 40 - fx * s) + "px," + (cy + 40 - fy * s) + "px) scale(" + s + ")";
}
// 人物（手前）と背景（奥）を少し違う量で動かす＝奥行き
function parallax(bg, fg, z, fx, fy, cx, cy, depth) {
  place(fg, z, fx, fy, cx, cy);
  var zb = z * (1 - 0.06 * depth);
  place(bg, zb, fx, fy, cx + (cx - 960) * 0 , cy);
  bg.style.transform += " translate(" + (-(fx - 343) * 0.05 * depth) + "px,0)";
}
// 手持ちカメラのゆれ（ゆっくり・小さく）
function shake(el, t, amt) {
  var dx = amt * (3.2 * Math.sin(t * 1.31) + 1.6 * Math.sin(t * 2.73 + 1.2) + 0.8 * Math.sin(t * 5.1 + .4));
  var dy = amt * (2.6 * Math.sin(t * 1.07 + 2.1) + 1.3 * Math.sin(t * 3.37 + .7) + 0.6 * Math.sin(t * 6.3));
  var r = amt * (0.12 * Math.sin(t * 0.93 + .5) + 0.05 * Math.sin(t * 2.1));
  el.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + r + "deg)";
}

// 透視変換（タブレットの画面にアプリの画面を合わせる）
function homography(w, h, q) {
  var src = [[0, 0], [w, 0], [w, h], [0, h]], A = [], B = [];
  for (var i = 0; i < 4; i++) { var x = src[i][0], y = src[i][1], X = q[i][0], Y = q[i][1];
    A.push([x, y, 1, 0, 0, 0, -X * x, -X * y]); B.push(X); A.push([0, 0, 0, x, y, 1, -Y * x, -Y * y]); B.push(Y); }
  for (var c = 0; c < 8; c++) { var p = c; for (var r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    var tA = A[c]; A[c] = A[p]; A[p] = tA; var tB = B[c]; B[c] = B[p]; B[p] = tB;
    for (var r2 = c + 1; r2 < 8; r2++) { var f = A[r2][c] / A[c][c]; for (var k = c; k < 8; k++) A[r2][k] -= f * A[c][k]; B[r2] -= f * B[c]; } }
  var a = new Array(8); for (var i2 = 7; i2 >= 0; i2--) { var s = B[i2]; for (var j = i2 + 1; j < 8; j++) s -= A[i2][j] * a[j]; a[i2] = s / A[i2][i2]; }
  return "matrix3d(" + [a[0], a[3], 0, a[6], a[1], a[4], 0, a[7], 0, 0, 1, 0, a[2], a[5], 0, 1].join(",") + ")";
}
$("tab").style.transform = homography(680, 540, [[191.7, 161.7], [348.3, 166.7], [346.7, 288.3], [190, 290]]);

// 操作の録画：[ナレーション, 動画, 開始位置(秒), 速さ, 見出し, 拡大する場所, 場面内の割合 from, to]
var CLIPS = [
  ["n5", "r_easy", 0.6, 1.45, "作業者用の<b>かんたん画面</b>", null, 0, 1],
  ["n6", "r_easy", 12.6, 1.0, "<b>コツ・注意点（急所）</b>も、動画と一緒に", [0.78, 0.42], 0, 1],
  ["n7", "r_lang", 0.2, 1.5, "<b>インドネシア語</b>にワンタッチで切り替え", null, 0, 0.6],
  ["n7", "r_trans", 0.3, 1.0, "翻訳は<b>日本語で意味を確認</b>", [0.5, 0.35], 0.6, 1],
  ["n8", "r_excel", 1.0, 1.4, "今の <b>Excel の要領書</b>をそのまま取り込み", null, 0, 1],
  ["n9", "r_cut", 0.4, 1.9, "1 本撮って、<b>区切るだけ</b>で動画付き", [0.5, 0.6], 0, 1]
];
var VIDS = {};
(function () {
  var scr = $("scr");
  CLIPS.forEach(function (c, i) {
    var v = document.createElement("img"); v.setAttribute("data-clip", c[1]); v.id = "clip" + i; v.alt = "";
    scr.appendChild(v); VIDS["clip" + i] = v;
  });
  VIDS.vtab = $("vtab");
  var FE = [["📴", "完全<br>オフライン"], ["🗄", "サーバー<br>不要"], ["💻", "性能の低い<br>PC でも軽快"], ["📱", "PC でも<br>タブレットでも"]];
  FE.forEach(function (x, i) {
    var d = document.createElement("div"); d.className = "card"; d.id = "fe" + i;
    d.style.left = (130 + i * 420) + "px"; d.style.top = "400px";
    d.innerHTML = '<div><div class="ic">' + x[0] + '</div><div class="tx">' + x[1] + '</div></div>';
    $("s_feat").appendChild(d);
  });
})();
// 録画はあらかじめ 1 コマずつの画像にしてある（fr/録画名/00001.jpg〜、30 コマ/秒）。時間に合うコマを表示する
var NFR = window.NFR || { r_easy: 569, r_lang: 353, r_cut: 473, r_excel: 319, r_trans: 346 };
var seeks = [];
function seekTo(img, time) {
  var clip = img.getAttribute("data-clip");
  var i = Math.max(1, Math.min(NFR[clip], Math.round(time * 30) + 1));
  var src = "fr/" + clip + "/" + String(i).padStart(5, "0") + ".jpg";
  if (img.getAttribute("src") === src) return;
  img.setAttribute("src", src);
  seeks.push(img.decode().catch(function () {}));
}

function render(t) {
  seeks = [];
  ["s_before", "s_after", "s_ui", "s_feat", "s_end"].forEach(function (id) {
    var o = vis(SC[id].a, SC[id].b, t);
    if (id === "s_after") o = Math.max(o, vis(RESULT.a, RESULT.b, t));
    $(id).style.opacity = o;
  });

  // ---- 1・2. これまで：紙を持つ手元 → ベテランの手の動きへ（顔は大きく映さない）
  var sb = SC.s_before, p1 = clamp((t - sb.a) / (SEG.n2.a - sb.a)), p2 = clamp((t - SEG.n2.a) / (sb.b - SEG.n2.a));
  shake($("cam1"), t, 1);
  // 顔は画面の上に切れるくらいに寄せ、紙を持つ手元・ベテランの手の動きを見せる
  if (t < SEG.n2.a) parallax($("b_bg"), $("b_fg"), lerp(2.1, 2.22, ease(p1)), lerp(230, 240, p1), 430, 1250, 650, 1);
  else parallax($("b_bg"), $("b_fg"), lerp(2.22, 1.9, ease(p2)), lerp(240, 470, ease(p2)), lerp(430, 380, ease(p2)), lerp(1250, 1150, ease(p2)), 640, 1 + p2);
  $("t_title").style.opacity = Math.min(ease((t - 0.6) / 1), 1 - ease((t - SEG.n2.a + .3) / .6));
  $("t_title").style.transform = "translateY(" + (24 - 24 * ease((t - .6) / 1)) + "px)";
  ["c_b1", "c_b2", "c_b3"].forEach(function (id, i) {
    var s = SEG.n2.a + 2.2 + i * 1.1;
    $(id).style.opacity = Math.min(ease((t - s) / .5), 1 - ease((t - sb.b + .6) / .5));
    $(id).style.transform = "translateX(" + (-40 + 40 * ease((t - s) / .5)) + "px)";
  });

  // ---- 3・4. これから：タブレットの画面 → 手元のライトとガラス → 全体
  var sa = SC.s_after, mid = SEG.n4.a;
  $("flash").style.opacity = t > sa.a - .3 && t < sa.a + .6 ? (1 - Math.abs(t - sa.a - .1) / .5) * .85 : 0;
  shake($("cam2"), t + 7, 1);
  if (t < RESULT.a - 1) {
    if (t < mid) {
      var q = ease(clamp((t - sa.a) / (mid - sa.a)));
      parallax($("a_bg"), $("a_fg"), lerp(3.3, 3.6, q), 270, 226, 960, 470, 1);
    } else {
      var q2 = ease(clamp((t - mid) / (sa.b - mid)));
      // 手元（ライトとガラス）に寄った状態から、少し引く
      var zz = q2 < .5 ? lerp(3.6, 2.0, ease(q2 * 2)) : lerp(2.0, 1.55, ease(q2 * 2 - 1));
      var fx = q2 < .5 ? lerp(270, 330, ease(q2 * 2)) : lerp(330, 420, ease(q2 * 2 - 1));
      var fy = q2 < .5 ? lerp(226, 600, ease(q2 * 2)) : lerp(600, 520, ease(q2 * 2 - 1));
      parallax($("a_bg"), $("a_fg"), zz, fx, fy, 980, 560, 1.4);
    }
  } else {
    // 11. 結果：ゆっくり横に回り込む
    var q3 = clamp((t - RESULT.a) / (RESULT.b - RESULT.a));
    parallax($("a_bg"), $("a_fg"), lerp(1.2, 1.32, q3), lerp(380, 450, q3), 430, 1300, 540, 1.6);
  }
  $("t_after").style.opacity = Math.min(ease((t - sa.a - .6) / .6), 1 - ease((t - mid + .2) / .5));
  $("r1").style.opacity = ease((t - SEG.n11.a - .3) / .6) * (t > RESULT.a - .5 ? 1 : 0);
  $("r2").style.opacity = ease((t - SEG.n11.a - 2.2) / .6) * (t > RESULT.a - .5 ? 1 : 0);
  // タブレットの中：プレーヤーで動画が流れている部分
  if ($("s_after").style.opacity > 0) seekTo(VIDS.vtab, 12.6 + ((t - sa.a) % 5));

  // ---- 5〜9. 操作の録画
  var lab = "", labO = 0, mw = $("monWrap");
  if (t >= SC.s_ui.a - 1 && t <= SC.s_ui.b + 1) {
    CLIPS.forEach(function (c, i) {
      var sg = SEG[c[0]], a = sg.a + sg.len * c[6], b = sg.a + sg.len * c[7];
      if (i === 0) a = SC.s_ui.a - 0.6;
      var v = VIDS["clip" + i], o = vis(a, b, t);
      v.style.opacity = o;
      if (o > 0) seekTo(v, c[2] + (t - a) * c[3]);
      if (t >= a && t < b) {
        var lp = (t - a) / (b - a);
        lab = c[4]; labO = Math.min(ease((t - a) / .4), 1 - ease((t - b + .4) / .4));
        var z = c[5] ? lerp(1, 1.22, ease(clamp(lp * 1.4))) : lerp(1, 1.05, lp);
        mw.style.transformOrigin = c[5] ? (c[5][0] * 100) + "% " + (c[5][1] * 100) + "%" : "50% 45%";
        mw.style.transform = "scale(" + z + ")";
      }
    });
  }
  $("lab").innerHTML = lab; $("lab").style.opacity = labO;

  // ---- 10
  for (var i = 0; i < 4; i++) {
    var s = SEG.n10.a + .5 + i * .7, e = $("fe" + i);
    e.style.opacity = ease((t - s) / .5); e.style.transform = "translateY(" + (40 - 40 * ease((t - s) / .5)) + "px)";
  }

  // ---- 字幕
  var sub = $("sub"), st = "", so = 0;
  ORDER.forEach(function (k) {
    if (k === "n12" || !TEXT[k]) return;
    var a = SEG[k].voice - .15, b = SEG[k].voice + DUR[k] + .35;
    var o = Math.min(ease((t - a) / .25), 1 - ease((t - b) / .25));
    if (o > so) { so = o; st = TEXT[k]; }
  });
  sub.innerHTML = st.replace(/\n/g, "<br>"); sub.style.opacity = so; sub.style.display = so > 0.01 ? "block" : "none";
  $("grain").src = "grain" + (Math.floor(t * 24) % 6) + ".png";
  // 新しいコマの画像が読み込まれてから次へ
  var two = function () { return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); }); };
  return Promise.all(seeks).then(two);
}
window.READY = Promise.resolve();
</script>
</body>
</html>
