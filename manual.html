<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業要領書</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="viewer">
<header class="topbar">
  <a class="btn on-navy" href="list.html" id="backLink">◀ 一覧</a>
  <h1 id="barTitle" class="crumb-title">作業要領書</h1>
  <div class="actions">
    <button type="button" class="btn on-navy" id="langBtn" hidden aria-pressed="false" title="インドネシア語の表示に切り替える">🌐 Bahasa Indonesia</button>
    <button type="button" class="btn on-navy" id="textSize" aria-pressed="false">文字 大</button>
    <a class="btn on-navy" id="editLink" href="editor.html">編集</a>
    <button type="button" class="btn on-navy print-btn" onclick="window.print()">印刷</button>
    <button type="button" class="btn primary-inv" id="stepMode">▶ 順に見る</button>
  </div>
</header>

<main class="page" id="doc">
  <div class="notice">読み込み中…</div>
</main>

<!-- 動画プレーヤー（1 つだけ用意して使い回す＝メモリ・負荷を抑える） -->
<div class="player tablet" id="player" role="dialog" aria-modal="true" aria-labelledby="pName">
  <div class="tp-top">
    <button type="button" class="tp-back" id="pClose" title="閉じる (Esc)">✕ 閉じる</button>
    <div class="tp-ttl"><small id="pCrumb"></small><b id="pTitle"></b></div>
    <button type="button" class="tp-back tp-speak" id="pSpeak" aria-pressed="false" title="手順と急所を声で読み上げる (V)">🔈 読み上げ：オフ</button>
    <div class="tp-count" id="pCount"></div>
  </div>
  <div class="tp-prog" id="pProg" aria-hidden="true"></div>

  <div class="tp-body" id="pBody">
    <div class="tp-media">
      <video id="pVideo" controls playsinline preload="none" disablepictureinpicture controlslist="nodownload noplaybackrate"></video>
      <div class="player-still" id="pStill" hidden></div>
      <div class="player-msg" id="pMsg"></div>
    </div>
    <div class="tp-info">
      <div class="tp-step">
        <div class="lbl" id="pNo"></div>
        <div class="txt" id="pName"></div>
        <div class="marks" id="pMarks"></div>
      </div>
      <div class="tp-points" id="pPoints"></div>
      <div class="tp-tools">
        <span class="seg-info" id="pTime"></span>
        <button type="button" class="tbtn" id="pRestart" title="最初から (Home)">⟲ 最初から</button>
        <span class="group" role="group" aria-label="再生速度">
          <button type="button" class="tbtn" data-rate="0.5">0.5倍</button>
          <button type="button" class="tbtn" data-rate="0.75">ゆっくり</button>
          <button type="button" class="tbtn active" data-rate="1">標準</button>
        </span>
        <button type="button" class="tbtn" id="pRepeat" aria-pressed="false" title="繰り返し (R)">↻ 繰り返し</button>
        <button type="button" class="tbtn" id="pAuto" aria-pressed="false" title="終わったら次の手順へ自動で進む (A)">⏭ 続けて再生</button>
      </div>
    </div>
  </div>

  <div class="tp-bottom">
    <button type="button" class="big" id="pPrev" title="前の手順 (←)">◀ 前へ</button>
    <button type="button" class="big pri" id="pPlay" title="再生／一時停止 (Space)">▶ 動画を再生</button>
    <button type="button" class="big" id="pNext" title="次の手順 (→)">次へ ▶</button>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="manuals/catalog.js"></script>
<script src="assets/viewer.js"></script>
<script src="assets/help.js"></script>
</body>
</html>
