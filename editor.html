<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業要領書の作成・編集</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="btn on-navy" href="index.html">◀ 一覧</a>
  <h1>作業要領書の作成・編集</h1>
  <div class="actions">
    <label class="btn on-navy" title="保存済みの要領書ファイル（.js）を開く">
      ファイルを開く<input type="file" id="openFile" accept=".js,.json" hidden>
    </label>
    <a class="btn on-navy" href="guide.html" target="_blank" title="スマホで動画を撮るときの設定">撮影ガイド</a>
    <button type="button" class="btn on-navy" id="importXl" title="Excel で作った要領書を読み込む">Excel 取り込み</button>
    <button type="button" class="btn on-navy" id="copyDoc" title="今の内容を元に、新しい要領書を作る">複製して新規</button>
    <button type="button" class="btn on-navy" id="newDoc">新規</button>
  </div>
</header>

<main class="page" id="form">
  <div class="notice" id="msg">読み込み中…</div>
</main>

<div class="toolbar-bottom">
  <button type="button" class="btn" id="addStep">＋ 手順を追加</button>
  <span style="flex:1"></span>
  <span class="hint" id="draftState" title="入力中の内容は、この PC のブラウザに一時保存されています"></span>
  <span class="save-dest" id="saveDest" hidden><span class="hint"></span><button type="button" class="btn small">変更</button></span>
  <button type="button" class="btn" id="preview">プレビュー</button>
  <button type="button" class="btn" id="save">ファイルに書き出す</button>
  <button type="button" class="btn primary" id="saveDir" hidden>フォルダに保存</button>
</div>

<!-- 区間設定用の動画プレビュー（1 つを使い回す） -->
<div class="player" id="seg" role="dialog" aria-modal="true" aria-labelledby="segTitle">
  <div class="player-head">
    <div class="label"><div class="step-name" id="segTitle">再生区間の設定</div>
      <div class="step-no" id="segSrc"></div></div>
    <button type="button" class="btn on-navy" id="segClose">✕ 閉じる</button>
  </div>
  <div class="player-body">
    <video id="segVideo" controls playsinline preload="none"></video>
    <div class="player-msg" id="segMsg"></div>
  </div>
  <div class="player-ctrl">
    <button type="button" class="btn on-navy" id="segSetStart">この位置を「開始」にする</button>
    <button type="button" class="btn on-navy" id="segSetEnd">この位置を「終了」にする</button>
    <button type="button" class="btn on-navy" id="segPlay">区間を再生</button>
    <span class="spacer"></span>
    <span class="seg-info" id="segInfo"></span>
  </div>
</div>

<!-- Excel 取り込み -->
<div class="sheet-dialog" id="xl" role="dialog" aria-modal="true" aria-labelledby="xlTitle">
  <div class="player-head">
    <div class="label"><div class="step-name" id="xlTitle">Excel から取り込み</div>
      <div class="step-no">Excel で作った要領書（.xlsx）を読み込んで、この形式に変換します</div></div>
    <button type="button" class="btn on-navy" id="xlClose">✕ 閉じる</button>
  </div>
  <div class="sheet-scroll">
    <div class="page">
      <div class="xl-pick">
        <label class="btn primary">Excel ファイルを選ぶ<input type="file" id="xlFile" accept=".xlsx,.xlsm" hidden></label>
        <label class="field"><span>シート</span><select id="xlSheet" disabled></select></label>
        <a class="btn" href="bulk.html">複数のファイルをまとめて取り込む →</a>
      </div>
      <div class="notice" id="xlMsg" hidden style="margin-bottom:12px"></div>
      <div id="xlBody" hidden>
        <section class="section"><h2>① 列の対応（自動判定。違っていれば選び直す）</h2>
          <div class="form-grid">
            <label class="field"><span>見出しの行</span><input type="number" id="xlHeader" min="1"></label>
          </div>
          <div class="form-grid" id="xlMap" style="margin-top:8px"></div>
        </section>
        <section class="section"><h2>② 読み取り結果</h2>
          <div class="xl-result">
            <div id="xlInfo"></div>
            <div id="xlSteps"></div>
          </div>
        </section>
        <section class="section"><h2>Excel の中身 <span class="hint">（濃い行＝見出し、太線＝手順の始まり、色付きの列＝使っている列）</span></h2>
          <div class="xl-grid" id="xlGrid"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="player-ctrl">
    <span class="hint" style="color:#fff">取り込んだ後、エディタで動画の区間を設定して保存します。</span>
    <span class="spacer"></span>
    <button type="button" class="btn primary" id="xlApply" disabled style="border-color:#fff">この内容で取り込む</button>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="manuals/catalog.js"></script>
<script src="assets/xlsx-reader.js"></script>
<script src="assets/importer.js"></script>
<script src="assets/video-check.js"></script>
<script src="assets/folder.js"></script>
<script src="assets/annotate.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>
