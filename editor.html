<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業要領書の作成・編集</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="btn on-navy" href="index.html">◀ 一覧</a>
  <h1>作業要領書の作成・編集</h1>
  <div class="actions">
    <label class="btn on-navy" title="保存済みの要領書ファイル（.js）を開く">
      ファイルを開く<input type="file" id="openFile" accept=".js,.json" hidden>
    </label>
    <button type="button" class="btn on-navy" id="newDoc">新規</button>
  </div>
</header>

<main class="page" id="form">
  <div class="notice" id="msg">読み込み中…</div>
</main>

<div class="toolbar-bottom">
  <button type="button" class="btn" id="addStep">＋ 手順を追加</button>
  <span style="flex:1"></span>
  <span class="hint" id="draftState"></span>
  <button type="button" class="btn" id="preview">プレビュー</button>
  <button type="button" class="btn" id="save">ファイルに書き出す</button>
  <button type="button" class="btn primary" id="saveDir" hidden>フォルダに保存</button>
</div>

<!-- 区間設定用の動画プレビュー（1 つを使い回す） -->
<div class="player" id="seg" role="dialog" aria-modal="true" aria-labelledby="segTitle">
  <div class="player-head">
    <div class="label"><div class="step-name" id="segTitle">再生区間の設定</div>
      <div class="step-no" id="segSrc"></div></div>
    <button type="button" class="btn on-navy" id="segClose">✕ 閉じる</button>
  </div>
  <div class="player-body">
    <video id="segVideo" controls playsinline preload="none"></video>
    <div class="player-msg" id="segMsg"></div>
  </div>
  <div class="player-ctrl">
    <button type="button" class="btn on-navy" id="segSetStart">この位置を「開始」にする</button>
    <button type="button" class="btn on-navy" id="segSetEnd">この位置を「終了」にする</button>
    <button type="button" class="btn on-navy" id="segPlay">区間を再生</button>
    <span class="spacer"></span>
    <span class="seg-info" id="segInfo"></span>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/editor.js"></script>
</body>
</html>
