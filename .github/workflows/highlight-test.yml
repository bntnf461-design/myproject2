# Highlight Maker の動作確認（push・プルリクエストのたびに自動で動かす）
name: Highlight Maker (test)
on:
  push:
    paths: ['highlight/**', 'tests/test_highlight.js', '.github/workflows/highlight-test.yml']
  pull_request:
    paths: ['highlight/**', 'tests/test_highlight.js', '.github/workflows/highlight-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Run tests
        run: node tests/test_highlight.js
